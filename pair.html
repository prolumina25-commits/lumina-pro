<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Lumina Pro — Sign in your TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl-fast.min.js"
        integrity="sha384-05+sicyRJQ56XpL4U9HJ8YbtSzFDvAg7apPKOGV6A0JsAJKFM68jp5oLnUjG5mEp"
        crossorigin="anonymous"></script>
<style>
  :root { --bg:#0B0E14; --elev:#141A24; --surface:#1B2330; --text:#F2F5FA; --dim:#93A0B4; --accent:#4F8CFF; --ok:#3DDC97; --bad:#FF5C6C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 system-ui,'Segoe UI',sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size:30px; margin:0; letter-spacing:2px; font-weight:900; }
  h1 span { color: var(--accent); }
  .tag { color: var(--dim); margin: 6px 0 24px; }
  label { display:block; color:var(--dim); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin:16px 0 6px; }
  input { width:100%; padding:14px; font-size:17px; border-radius:12px; border:2px solid var(--surface); background:var(--elev); color:var(--text); }
  input:focus { outline:none; border-color: var(--accent); }
  .row { position:relative; }
  .paste { position:absolute; right:8px; top:8px; padding:7px 12px; border-radius:8px; border:0; background:var(--surface); color:var(--text); font-weight:700; font-size:14px; }
  button.go { width:100%; margin-top:24px; padding:16px; font-size:18px; font-weight:800; border:0; border-radius:14px; background:var(--accent); color:#fff; }
  button.go:disabled { opacity:.6; }
  .msg { margin-top:18px; padding:14px 16px; border-radius:12px; background:var(--surface); display:none; }
  .msg.ok { display:block; border-left:4px solid var(--ok); }
  .msg.bad { display:block; border-left:4px solid var(--bad); }
  .fine { color: var(--dim); font-size:13px; margin-top:26px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LUMINA <span>PRO</span></h1>
  <div class="tag">Send your sign-in details to the TV. Paste them in — no typing with the remote.</div>

  <form id="f" autocomplete="on">
    <label for="h">Server URL</label>
    <div class="row"><input id="h" name="url" type="url" inputmode="url" placeholder="https://your-server.com" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" class="paste" data-for="h">Paste</button></div>
    <label for="u">Username</label>
    <div class="row"><input id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" class="paste" data-for="u">Paste</button></div>
    <label for="p">Password</label>
    <div class="row"><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" class="paste" data-for="p">Paste</button></div>
    <button class="go" id="go" type="submit">Send to my TV</button>
  </form>
  <div class="msg" id="msg"></div>
  <p class="fine">Your details are encrypted on this phone with a one-time key that only your TV has (it's in the QR code and never sent anywhere), then passed to the TV through a public relay that can't read them.</p>
</div>
<script>
(function () {
  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  function enc(bytes) {
    var out = '';
    for (var i = 0; i < bytes.length; i += 3) {
      var n = (bytes[i] << 16) | ((bytes[i + 1] || 0) << 8) | (bytes[i + 2] || 0);
      out += B64[(n >> 18) & 63] + B64[(n >> 12) & 63];
      if (i + 1 < bytes.length) out += B64[(n >> 6) & 63];
      if (i + 2 < bytes.length) out += B64[n & 63];
    }
    return out;
  }
  function dec(s) {
    var out = [], buf = 0, bits = 0;
    for (var i = 0; i < s.length; i++) {
      var v = B64.indexOf(s[i]); if (v < 0) continue;
      buf = (buf << 6) | v; bits += 6;
      if (bits >= 8) { bits -= 8; out.push((buf >> bits) & 255); }
    }
    return new Uint8Array(out);
  }
  var params = new URLSearchParams(location.hash.slice(1));
  var topic = params.get('t') || '', key = dec(params.get('k') || '');
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  function show(cls, text) { msg.className = 'msg ' + cls; msg.textContent = text; }

  if (!/^lumina-[A-Za-z0-9_-]{16,}$/.test(topic) || key.length !== 32 || !window.nacl) {
    show('bad', 'This link is incomplete. Scan the QR code on the TV sign-in screen again.');
    go.disabled = true;
  }

  document.querySelectorAll('.paste').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!navigator.clipboard || !navigator.clipboard.readText) return document.getElementById(b.dataset.for).focus();
      navigator.clipboard.readText().then(function (t) { document.getElementById(b.dataset.for).value = t.trim(); })
        .catch(function () { document.getElementById(b.dataset.for).focus(); });
    });
  });

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var payload = JSON.stringify({
      h: document.getElementById('h').value.trim(),
      u: document.getElementById('u').value.trim(),
      p: document.getElementById('p').value.trim()
    });
    var nonce = nacl.randomBytes(nacl.secretbox.nonceLength);
    var box = nacl.secretbox(new TextEncoder().encode(payload), nonce, key);
    var packed = new Uint8Array(nonce.length + box.length);
    packed.set(nonce); packed.set(box, nonce.length);
    go.disabled = true; go.textContent = 'Sending…';
    fetch('https://ntfy.sh/' + topic, { method: 'POST', body: enc(packed) })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        show('ok', '✓ Sent! Your TV will sign in within a few seconds. You can close this page.');
        go.textContent = 'Sent ✓';
      })
      .catch(function () {
        show('bad', "Couldn't send — check this phone's internet connection and try again.");
        go.disabled = false; go.textContent = 'Send to my TV';
      });
  });
})();
</script>
</body>
</html>
